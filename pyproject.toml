[project]
name = "langchainupdated"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.2",
    "langchain-groq>=1.1.3",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "python-dotenv>=1.2.2",
    "pageindex>=0.1.0",
    "pypdf>=5.1.0",
    "requests>=2.32.0",
]

[project.scripts]
langchainupdated = "langchainupdated:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
system-certs = true
environments = ["sys_platform == 'win32'"]
